services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db-ssdm
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: KeycloakPolri2026!
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - ssdm-iam-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    container_name: keycloak-ssdm-iam
    command: start-dev --import-realm
    environment:
      # Kredensial Administrator Awal (Tanpa Perlu Email)
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: Polri2026!
      
      # Konfigurasi Koneksi Basis Data Khusus Keycloak
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: KeycloakPolri2026!
      
      # Pengaturan HTTP & Keamanan
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      # Auto-import Realm resmi SSDM Polri saat startup
      - ./realm-ssdm-polri.json:/opt/keycloak/data/import/realm-ssdm-polri.json:ro
      # Direktori untuk Custom Theme (Keycloakify / HTML CSS UI Keren)
      - ./themes:/opt/keycloak/themes
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - ssdm-iam-network
    restart: unless-stopped

networks:
  ssdm-iam-network:
    name: ssdm-iam-network
    driver: bridge

volumes:
  keycloak_postgres_data:
    name: keycloak_postgres_data
